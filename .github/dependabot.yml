version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      # Satu PR untuk semua update minor/patch supaya tidak banjir PR.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major version (mis. TypeScript 7, ESLint 10) dikerjakan manual.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
