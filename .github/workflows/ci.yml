name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Tipe route next-intl/Next di-generate, belum ada di clone baru.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # Build yang sama dengan Workers Builds: `next build` (lewat
      # `npm run build`) lalu dibungkus OpenNext untuk Cloudflare Workers.
      - name: Build (OpenNext)
        run: npx opennextjs-cloudflare build

      - name: Worker bundle fits free plan
        run: npm run cf:size

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
